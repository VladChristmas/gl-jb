<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3"/>
      <stop offset="100%" style="stop-color:#0051a3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Camera icon -->
    <rect x="-100" y="-70" width="200" height="140" rx="20" fill="white" opacity="0.95"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0071e3" stroke-width="8"/>
    <circle cx="0" cy="0" r="25" fill="#0071e3"/>
    <circle cx="0" cy="0" r="12" fill="white"/>
    <!-- Flash -->
    <polygon points="60,-80 80,-50 60,-50" fill="#FFD700"/>
    <!-- Photo stack -->
    <rect x="-60" y="80" width="120" height="90" rx="8" fill="white" opacity="0.9"/>
    <rect x="-50" y="90" width="100" height="70" rx="4" fill="#f0f0f0"/>
    <polygon points="-30,120 20,120 20,140 -10,140" fill="#0071e3" opacity="0.8"/>
    <polygon points="-20,125 30,125 10,145" fill="#0071e3" opacity="0.6"/>
  </g>
</svg>