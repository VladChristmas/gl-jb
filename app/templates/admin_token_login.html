{% extends "base.html" %}

{% block title %}Вход по токену суперадмина{% endblock %}

{% block content %}
<div class="login-box">
    <h1>Вход суперадмина</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="token">Токен</label>
            <input type="text" id="token" name="token" required placeholder="Вставьте токен сюда" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">
        <a href="{{ url_for('auth.admin_login') }}">Войти паролем</a>
    </p>
</div>
{% endblock %}
