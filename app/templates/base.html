<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0071e3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GL_JB">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <title>{% block title %}Фото заказов{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flashes">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
    // Toast utility
    function showToast(message, actionLabel, actionFn, duration) {
        duration = duration || 5000;
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<span>' + message + '</span>';
        if (actionLabel && actionFn) {
            const btn = document.createElement('button');
            btn.className = 'toast-action';
            btn.textContent = actionLabel;
            btn.onclick = function() { actionFn(); dismiss(); };
            toast.appendChild(btn);
        }
        container.appendChild(toast);
        let dismissed = false;
        function dismiss() {
            if (dismissed) return;
            dismissed = true;
            toast.classList.add('toast-out');
            setTimeout(function() { toast.remove(); }, 300);
        }
        setTimeout(dismiss, duration);
        return dismiss;
    }

    // Confirm with undo toast — intercepts form submit
    function confirmDelete(form, message) {
        event.preventDefault();
        showToast(message, 'Удалить', function() { form.submit(); }, 5000);
        return false;
    }

    // Debounced live search — auto-submit form after typing pause
    function enableLiveSearch(inputId, formSelector) {
        var input = document.getElementById(inputId);
        if (!input) return;
        var timer;
        input.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(function() {
                var form = input.closest(formSelector || 'form');
                if (form) form.submit();
            }, 400);
        });
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('{{ url_for('static', filename='sw.js') }}')
                .then(registration => {
                    console.log('[SW] Registered:', registration.scope);
                })
                .catch(error => {
                    console.log('[SW] Registration failed:', error);
                });
        });
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
