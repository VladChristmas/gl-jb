{% extends "base.html" %}

{% block title %}Требуется вход{% endblock %}

{% block content %}
<div class="empty-state" style="margin-top: 80px;">
    <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <div class="empty-state-title">401 — Требуется вход</div>
    <div class="empty-state-text">Сессия истекла или вы не авторизованы. Войдите, чтобы продолжить.</div>
    <a href="{{ url_for('auth.unified_login') }}" class="btn btn-primary" style="margin-top: 24px;">Войти</a>
</div>
{% endblock %}
