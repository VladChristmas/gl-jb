{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="empty-state" style="margin-top: 80px;">
    <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
    </svg>
    <div class="empty-state-title">404 — Страница не найдена</div>
    <div class="empty-state-text">Возможно, ссылка устарела или была удалена.</div>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="margin-top: 24px;">На главную</a>
</div>
{% endblock %}
