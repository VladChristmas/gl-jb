{% extends "base.html" %}

{% block title %}Вход по токену{% endblock %}

{% block content %}
<div class="login-box">
    <h1>Вход в систему</h1>
    <p class="subtitle">Введите ваш токен для доступа к заказам</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="token">Токен</label>
            <input type="text" id="token" name="token" required placeholder="Вставьте токен сюда" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Войти</button>
    </form>
</div>
{% endblock %}
